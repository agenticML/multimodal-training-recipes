[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-training-recipes"
version = "0.1.0"
description = "Reproducible Hugging Face training recipes across speech, text, image, video, and biomedical tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
hf = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "diffusers>=0.35",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "safetensors>=0.4",
  "transformers>=4.57,<6",
]
media = ["numpy>=1.26", "Pillow>=10", "soundfile>=0.12", "torchvision>=0.20"]
dev = ["pytest>=8", "ruff>=0.8"]
all = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "diffusers>=0.35",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "Pillow>=10",
  "safetensors>=0.4",
  "soundfile>=0.12",
  "transformers>=4.57,<6",
  "torchvision>=0.20",
]

[project.scripts]
training-recipe = "training_recipes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
