[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-training-recipes"
version = "0.1.0"
description = "Reproducible Hugging Face training recipes across speech, text, image, video, and biomedical tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "av>=13",
  "datasets>=3.0",
  "diffusers>=0.35",
  "einops>=0.8",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "librosa>=0.10",
  "numpy>=1.26",
  "peft>=0.14",
  "Pillow>=10",
  "protobuf>=4.25",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "scipy>=1.11",
  "sentencepiece>=0.1.99",
  "soundfile>=0.12",
  "torch>=2.0",
  "torchaudio>=2.0",
  "torchvision>=0.20",
  "transformers>=4.57,<6",
]

[project.optional-dependencies]
hf = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "diffusers>=0.35",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "peft>=0.14",
  "protobuf>=4.25",
  "safetensors>=0.4",
  "sentencepiece>=0.1.99",
  "transformers>=4.57,<6",
]
media = [
  "av>=13",
  "librosa>=0.10",
  "numpy>=1.26",
  "Pillow>=10",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torchaudio>=2.0",
  "torchvision>=0.20",
]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
all = [
  "accelerate>=1.0",
  "av>=13",
  "bitsandbytes>=0.45",
  "datasets>=3.0",
  "diffusers>=0.35",
  "einops>=0.8",
  "evaluate>=0.4",
  "huggingface-hub>=0.34",
  "librosa>=0.10",
  "num2words>=0.5",
  "numpy>=1.26",
  "peft>=0.14",
  "phonemizer>=3.2",
  "Pillow>=10",
  "protobuf>=4.25",
  "safetensors>=0.4",
  "scipy>=1.11",
  "sentencepiece>=0.1.99",
  "soundfile>=0.12",
  "torchaudio>=2.0",
  "torchvision>=0.20",
  "transformers>=4.57,<6",
]

[project.scripts]
training-recipe = "training_recipes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"training_recipes.dashboard" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
