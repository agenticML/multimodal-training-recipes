<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smoke dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Smoke dashboard</h1>
        <p class="subtitle">Local smoke training runs</p>
      </div>
      <div class="chips" id="chips">
        <span class="chip">profile = smoke</span>
        <span class="chip" id="output-chip">output dir</span>
      </div>
    </header>
    <main class="layout">
      <aside class="rail">
        <section>
          <h2>Tasks</h2>
          <ul id="task-list" class="list"></ul>
        </section>
        <section>
          <h2>Architectures</h2>
          <p id="arch-hint" class="hint">Select a task</p>
          <ul id="arch-list" class="list"></ul>
        </section>
      </aside>
      <section class="stage">
        <div class="toolbar">
          <div id="selection" class="selection">No architecture selected</div>
          <button id="run-btn" type="button" disabled>Run</button>
        </div>
        <p id="status-line" class="status">Idle</p>
        <p id="output-path" class="hint"></p>
        <div class="panel">
          <h2>Logs</h2>
          <pre id="logs" class="logs"></pre>
        </div>
        <div id="summary-panel" class="panel hidden">
          <h2>Summary</h2>
          <dl id="summary" class="summary"></dl>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
